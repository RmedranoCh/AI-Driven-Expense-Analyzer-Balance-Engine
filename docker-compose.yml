version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: expense_db_container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: invoice_engine_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d invoice_engine_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: 
      context: .
      dockerfile: docker/Dockerfile
    container_name: expense_app_container
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local